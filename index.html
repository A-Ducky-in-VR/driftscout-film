<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#09090b">
<title>Prowl</title>
<!--
  The film site players open. One static page, no build step: DriftScout copies
  this file into the film folder on every publish (filling in the site's name)
  and writes the match data next to it (matches.json and m/<slug>.json).
  Edit it here, not in the folder.

  Look: black cat. Near-black page, charcoal panels, amber "eyes" for anything
  active. Team colours are the in-game ones, set per match.
-->
<style>
:root {
  --bg: #09090b; --panel: #131316; --edge: #26262c; --text: #ededf2; --muted: #9a99a6;
  --eye: #f4c542; --eye-ink: #1b1500; --good: #86d98a; --bad: #f2828f; --nose: #f08fa0;
  --home: #d9771c; --away: #2f95dc; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--edge); }
header a { display: flex; align-items: center; gap: 9px; color: var(--text); text-decoration: none; font-size: 19px; font-weight: 700; letter-spacing: .02em; }
header svg { width: 30px; height: 30px; flex: none; }
header span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { max-width: 1240px; margin: 0 auto; padding: 14px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 2px; }
h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 12px; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }
input[type="checkbox"] { accent-color: var(--eye); }
button.link { background: none; border: 0; padding: 0; color: var(--eye); text-decoration: underline; }
:focus-visible { outline: 2px solid var(--eye); outline-offset: 2px; }

.gate { display: flex; gap: 8px; margin: 12px 0 6px; max-width: 360px; }
.gate input { flex: 1; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 12px; min-width: 0; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin-top: 14px; }
.card { display: block; text-align: left; width: 100%; padding: 14px; border-radius: 12px; }
.card:hover { border-color: var(--eye); }
.card strong { display: block; font-size: 16px; margin-bottom: 4px; }

.layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr); grid-template-areas: "stage side" "extras side"; gap: 16px; align-items: start; margin-top: 12px; }
.stage { grid-area: stage; min-width: 0; }
.side { grid-area: side; }
.extras { grid-area: extras; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.box-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 14px; }
.box-head .legend { margin: 0; }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
.swatch.after { margin: 0 0 0 8px; }
.swatch.t0, .poss-bar .t0 { background: var(--home); }
.swatch.t1, .poss-bar .t1 { background: var(--away); }

/* Map */
.minimap { display: block; width: 100%; height: auto; }
.minimap .wall { fill: none; stroke: #8b8a98; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.minimap .platform { fill: rgba(255, 255, 255, .05); stroke: #34343c; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.minimap .halfway { stroke: #34343c; stroke-width: 1.5; stroke-dasharray: 5 6; }
.minimap .t0 .dot, .minimap .t0 .arrow, .minimap .goal.t0 { fill: var(--home); }
.minimap .t1 .dot, .minimap .t1 .arrow, .minimap .goal.t1 { fill: var(--away); }
.minimap .dot { stroke: var(--bg); stroke-width: 1.5; }
.minimap .dot-label { fill: var(--text); font-size: 10px; paint-order: stroke; stroke: #0f0f12; stroke-width: 2.5px; }
.minimap .ball { fill: #fff; stroke: var(--bg); stroke-width: 1.5; }

/* Possession and momentum: thin marks in the team colours, numbers and labels in text ink. */
.poss-labels { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.poss-bar { display: flex; gap: 2px; height: 12px; margin-bottom: 8px; }
.poss-bar i { display: block; min-width: 2px; flex-basis: 0; }
.poss-bar i:first-child { border-radius: 4px 0 0 4px; }
.poss-bar i:last-child { border-radius: 0 4px 4px 0; }
.poss-bar .loose { background: var(--edge); }
.chart { position: relative; cursor: crosshair; }
.chart svg { display: block; width: 100%; height: auto; }
.chart svg * { vector-effect: non-scaling-stroke; }
.chart .grid { stroke: var(--edge); stroke-width: 1; }
.chart .grid.zero { stroke: #3d3d46; }
.chart .tick { fill: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { stroke: none; opacity: .16; }
.chart .series.t0 .line { stroke: var(--home); } .chart .series.t0 .area { fill: var(--home); }
.chart .series.t1 .line { stroke: var(--away); } .chart .series.t1 .area { fill: var(--away); }
.chart .goal-dot { stroke: var(--panel); stroke-width: 2; }
.chart .goal-dot.t0 { fill: var(--home); } .chart .goal-dot.t1 { fill: var(--away); }
.chart .crosshair { stroke: var(--muted); stroke-width: 1; }
.chart .playhead { stroke: var(--eye); stroke-width: 1.5; }
.chart .tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--bg); border: 1px solid var(--edge); border-radius: 6px; padding: 3px 8px; font-size: 12px; white-space: nowrap; pointer-events: none; }
.chart-table summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.chart-table table { margin-top: 8px; border-collapse: collapse; }
.chart-table td, .chart-table th { text-align: left; padding: 4px 12px 4px 0; border-top: 1px solid var(--edge); font-size: 13px; }
.video { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--edge); }
.video iframe, .video > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.transport label { color: var(--muted); display: flex; align-items: center; gap: 6px; }
.now { margin: 8px 0 0; min-height: 22px; }

.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.box { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 12px; min-width: 0; }
.side select { width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 11px; border-radius: 999px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--eye); border-color: var(--eye); color: var(--eye-ink); font-weight: 600; }
.chip.none { opacity: .6; }
.chip .count { opacity: .75; font-variant-numeric: tabular-nums; margin-left: 2px; }
.check { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-top: 8px; }
.only { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin: 0 0 8px; font-size: 13px; }

.moments { list-style: none; margin: 8px 0 0; padding: 0; max-height: 72vh; overflow-y: auto; }
.moment { display: grid; grid-template-columns: 4px 52px 1fr; gap: 10px; align-items: center; width: 100%; text-align: left;
  background: none; border: 0; border-top: 1px solid var(--edge); border-radius: 0; padding: 9px 6px 9px 0; }
.moment:hover { background: rgba(255, 255, 255, .05); }
.moment.current { background: rgba(244, 197, 66, .12); box-shadow: inset 3px 0 0 var(--eye); }
.moment .bar { align-self: stretch; border-radius: 2px; background: var(--edge); }
.moment .bar.t0 { background: var(--home); }
.moment .bar.t1 { background: var(--away); }
.moment time { color: var(--muted); font-variant-numeric: tabular-nums; }
.moment .kind { display: block; font-size: 12px; color: var(--muted); }
.moment .kind.good { color: var(--good); }
.moment .kind.bad { color: var(--bad); }
.moment.goal .title { font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin: 10px 0 0; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

/* A player's game */
details.box > summary { cursor: pointer; font-weight: 600; list-style-position: inside; }
details.box[open] > summary { margin-bottom: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-bottom: 12px; }
.tile { background: var(--bg); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px; }
.tile b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }
.thirds { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 6px 0 4px; background: var(--edge); }
.thirds i { display: block; height: 100%; }
.thirds .d { background: var(--muted); } .thirds .m { background: #5d5c68; } .thirds .a { background: var(--eye); }
.points { margin: 0 0 10px; padding: 0; list-style: none; }
.points li { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--edge); }
.points li:first-child { border-top: 0; }
.points.good li::before { content: "+"; color: var(--good); font-weight: 700; }
.points.bad li::before { content: "!"; color: var(--bad); font-weight: 700; }
.points li > span { flex: 1; }

@media (max-width: 820px) {
  main { padding: 8px 10px 40px; }
  .layout { grid-template-columns: 1fr; grid-template-areas: "stage" "side" "extras"; gap: 10px; }
  .stage { position: sticky; top: 0; background: var(--bg); padding: 6px 0 8px; z-index: 2; margin: 0 -10px; padding-left: 10px; padding-right: 10px; }
  .moments { max-height: none; }
  .now { display: none; }
  h1 { font-size: 17px; }
  button, select { padding: 10px 12px; }  /* easier to hit with a thumb */
  .moment { padding: 12px 6px 12px 0; }
}
</style>
</head>
<body>
<header>
  <a href="#" aria-label="Prowl, all matches">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M6 13 7 4l6 5q3-1 6 0l6-5 1 9q2 4 0 8-3 6-10 6T6 21q-2-4 0-8Z" fill="#17171c" stroke="#4a4a56" stroke-width="1.2" stroke-linejoin="round"/>
      <ellipse cx="11.5" cy="17" rx="2.7" ry="2.1" fill="#f4c542"/><ellipse cx="20.5" cy="17" rx="2.7" ry="2.1" fill="#f4c542"/>
      <ellipse cx="11.5" cy="17" rx=".65" ry="1.9" fill="#09090b"/><ellipse cx="20.5" cy="17" rx=".65" ry="1.9" fill="#09090b"/>
      <path d="m15 21 2 0-1 1.3Z" fill="#f08fa0"/>
    </svg>
    Prowl
  </a>
  <span id="crumb"></span>
</header>
<main id="app"><p class="muted">Loading...</p></main>

<script>
"use strict";

// The filter chips. A moment can sit under more than one (m.kinds): a goal with an assist is
// also under "assist", a reset is also a pass. Passes start switched off: there can be a hundred.
const KINDS = { goal: "Goals", assist: "Assists", save: "Saves", shot: "Shots", pass: "Passes", reset: "Resets", clear: "Clears", turnover: "Turnovers", fifty: "50/50s", kiwi: "Kiwis", tag: "Coach notes" };
const ONE = { goal: "Goal", save: "Save", shot: "Shot", pass: "Pass", reset: "Reset", clear: "Clear", turnover: "Turnover", fifty: "50/50", kiwi: "Kiwi", tag: "Coach note" };
// What a moment was for the player whose list this is: [label, "good" | "bad" | ""].
const MINE = {
  "goal:scorer": ["Your goal", "good"], "goal:assist": ["Your assist", "good"], "save:save": ["Your save", "good"], "shot:shot": ["Your shot", ""],
  "pass:passer": ["Your pass", ""], "pass:receiver": ["Pass to you", ""], "reset:passer": ["Your reset", ""], "reset:receiver": ["Reset to you", ""], "clear:clear": ["Your clear", ""],
  "turnover:won": ["You won the ball", "good"], "turnover:lost": ["You lost the ball", "bad"],
  "fifty:won": ["50/50 won", "good"], "fifty:lost": ["50/50 lost", "bad"], "fifty:contested": ["Your 50/50", ""],
  "kiwi:kiwi": ["Your kiwi", ""], "kiwi:kiwi_against": ["Kiwi on you", ""], "tag:note": ["Coach note for you", ""],
};
const DEFAULT_COLORS = ["#d9771c", "#2f95dc"];
const app = document.getElementById("app");
const crumb = document.getElementById("crumb");
let view = null; // the open match: data, filters, player
let ticker = 0;

// ------------------------------------------------------------------ helpers

// Every name and title goes in as text, never as HTML.
function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== false && value != null) node.setAttribute(key, value === true ? "" : value);
  }
  for (const kid of kids) if (kid != null) node.append(kid);
  return node;
}

function clock(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${r}` : `${m}:${r}`;
}

function day(ms) {
  return new Date(ms).toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" });
}

function percent(share) {
  return `${Math.round(share * 100)}%`;
}

async function fetchJson(path) {
  const response = await fetch(`${path}?v=${Date.now()}`); // always the latest publish
  if (!response.ok) throw new Error(String(response.status));
  return response.json();
}

// ------------------------------------------------------------------ password
// When the site has a password, every data file is encrypted (see driftscout/lock.py) and
// lock.json says how to turn the password into the key. Checking the password IS decrypting:
// there is nothing here that could be skipped to get at the matches.

let key = null; // the decryption key, once the right password has been given

function bytes(base64) {
  return Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
}

async function keyFrom(password, how) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: how.hash, salt: bytes(how.salt), iterations: how.iterations }, material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function unseal(sealed, withKey) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(sealed.iv) }, withKey, bytes(sealed.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function load(path) {
  const body = await fetchJson(path);
  return body && body.locked ? unseal(body, key) : body;
}

// True when the matches can be read: no password on the site, or the right one was given.
async function unlocked() {
  if (key) return true;
  let how;
  try { how = await fetchJson("lock.json"); } catch (e) { return true; } // no lock file: an open site
  const attempt = async (password) => {
    const candidate = await keyFrom(password, how);
    await unseal(await fetchJson("matches.json"), candidate); // throws on a wrong password
    key = candidate;
    remember("film-pass", password);
  };
  if (remember("film-pass")) {
    try { await attempt(remember("film-pass")); return true; } catch (e) { /* the password has changed since */ }
  }
  const input = el("input", { type: "password", "aria-label": "Password", autocomplete: "current-password", placeholder: "Password" });
  const note = el("p", { class: "muted small", role: "status" });
  const button = el("button", { type: "submit" }, "Open");
  app.replaceChildren(
    el("h1", null, "This film is private"),
    el("p", { class: "muted" }, "Ask your captain for the password."),
    el("form", { class: "gate", onsubmit: async (e) => {
      e.preventDefault();
      button.disabled = true;
      note.textContent = "Checking...";
      try { await attempt(input.value); route(); } catch (err) { note.textContent = "That password didn't open it."; button.disabled = false; input.select(); }
    } }, input, button),
    note);
  input.focus();
  return false;
}

function remember(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key) || "";
    localStorage.setItem(key, value);
  } catch (e) { /* private browsing: just don't remember */ }
  return "";
}

function teamColors(colors) {
  const ok = (c) => typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c);
  document.documentElement.style.setProperty("--home", colors && ok(colors[0]) ? colors[0] : DEFAULT_COLORS[0]);
  document.documentElement.style.setProperty("--away", colors && ok(colors[1]) ? colors[1] : DEFAULT_COLORS[1]);
}

let youtube = null;
function youtubeApi() {
  youtube = youtube || new Promise((resolve) => {
    window.onYouTubeIframeAPIReady = () => resolve(window.YT);
    document.head.append(el("script", { src: "https://www.youtube.com/iframe_api" }));
  });
  return youtube;
}

// ------------------------------------------------------------------ match list

async function showList() {
  crumb.textContent = "";
  teamColors(null);
  let matches = [];
  try {
    matches = await load("matches.json");
  } catch (e) { /* nothing published yet */ }
  if (!matches.length) {
    app.replaceChildren(el("p", { class: "muted" }, "No matches have been published yet."));
    return;
  }
  app.replaceChildren(
    el("h1", null, "Matches"),
    el("p", { class: "muted" }, "Pick a match, then pick your name to see your own moments."),
    el("div", { class: "cards" }, ...matches.map((m) =>
      el("button", { class: "card", onclick: () => { location.hash = m.slug; } },
        el("strong", null, m.title),
        el("span", { class: "muted" }, `${day(m.played_at)} · ${m.teams[0]} ${m.goals[0]}, ${m.teams[1]} ${m.goals[1]} · ${m.moments} moments`)))),
  );
}

// ------------------------------------------------------------------ one match

// The list is for everyone (""), a whole team ("team:0" / "team:1") or one player (their name).
function teamView() {
  return view.who === "team:0" ? 0 : view.who === "team:1" ? 1 : null;
}

// Moments that are one team's gain and the other's loss: both teams see them.
const BOTH_TEAMS = ["goal", "save", "shot", "turnover", "fifty", "kiwi"];

function teamOf(name) {
  const player = view.data.players.find((p) => p.name === name);
  return player ? player.team : null;
}

function kindsOf(m) {
  return m.kinds || [m.type];
}

// The moments for whoever is picked, before the chips are applied.
function forWho() {
  const team = teamView();
  if (team !== null) return view.data.moments.filter((m) => BOTH_TEAMS.includes(m.type) || m.team === team || (m.type === "tag" && m.team == null));
  return view.data.moments.filter((m) => !view.who || m.players.includes(view.who) || (view.everyGoal && m.type === "goal"));
}

// What a moment was for a whole team.
function kindForTeam(m, team, estimated) {
  const ours = m.team === team;
  if (m.type === "goal") return ours ? ["Goal for", "good"] : ["Goal against", "bad"];
  if (m.type === "save") return ours ? ["Save", "good"] : ["Shot saved", ""];
  if (m.type === "shot") return ours ? ["Shot", ""] : ["Shot against", ""];
  if (m.type === "turnover") return ours ? ["Won the ball", "good"] : ["Lost the ball", "bad"];
  if (m.type === "fifty") return m.won == null ? ["50/50" + estimated, ""] : m.won === team ? ["50/50 won" + estimated, "good"] : ["50/50 lost" + estimated, "bad"];
  if (m.type === "kiwi") {
    if (ours) return m.won ? ["Kiwi, won the ball" + estimated, "good"] : ["Kiwi" + estimated, ""];
    return m.won ? ["Kiwi against, ball lost" + estimated, "bad"] : ["Kiwi against" + estimated, ""];
  }
  return [(ONE[m.type] || m.type) + estimated, ""];
}

function visibleMoments() {
  if (view.only) return view.data.moments.filter((m) => view.only.ids.has(m.id));
  return forWho().filter((m) => kindsOf(m).some((k) => view.kinds.has(k)));
}

// The small line above a moment: what it is, and what it was for the player picked.
function kindOf(m) {
  const estimated = m.source === "positions" ? " (estimated)" : "";
  if (teamView() !== null) return kindForTeam(m, teamView(), estimated);
  if (view.who) {
    const role = (m.roles || {})[view.who];
    const mine = role && MINE[`${m.type}:${role}`];
    if (mine) {
      let [label, tone] = mine;
      if (m.type === "kiwi" && m.won) [label, tone] = role === "kiwi" ? ["Your kiwi, won the ball", "good"] : ["Kiwi on you, ball lost", "bad"];
      return [label + estimated, tone];
    }
    if (m.type === "goal" && m.team != null) return m.team === teamOf(view.who) ? ["Goal for", "good"] : ["Goal against", "bad"];
  }
  return [(ONE[m.type] || m.type) + estimated, ""];
}

function describe(m) {
  let text = m.title;
  if (m.type === "goal" && m.score) text += ` (${m.score[0]}-${m.score[1]})`;
  if (m.type === "fifty" && m.won != null) text += `, ${view.data.teams[m.won]} came away with it`;
  if (m.type === "kiwi") text += m.won ? ", won the ball" : m.reached === false ? ", didn't get there" : ", got to the carrier";
  return text;
}

function play(moment) {
  if (!view.player) return;
  view.playing = view.shown = moment.id;
  view.player.seekTo(Math.max(0, moment.video_t - moment.lead), true);
  view.player.playVideo();
  paint();
}

function step(by) {
  const list = visibleMoments();
  if (!list.length) return;
  const at = list.findIndex((m) => m.id === view.playing);
  const next = at < 0 ? (by > 0 ? 0 : list.length - 1) : at + by;
  if (next >= 0 && next < list.length) play(list[next]);
}

function tick() {
  if (!view || !view.player || !view.player.getCurrentTime) return;
  const now = view.player.getCurrentTime();
  paintExtras(now);
  const list = visibleMoments();
  const playing = list.find((m) => m.id === view.playing);
  const inWindow = (m) => now >= m.video_t - m.lead && now <= m.video_t + m.tail;
  // Back to back: when a clip has run its course, move to the next one.
  if (view.backToBack && playing && now > playing.video_t + playing.tail) {
    const next = list[list.indexOf(playing) + 1];
    if (!next) {
      view.backToBack = false;
      view.player.pauseVideo();
      return render();
    }
    // Clips that overlap just keep rolling; jumping back would replay what was just watched.
    if (!inWindow(next)) return play(next);
    view.playing = next.id;
  }
  // Highlight the clip being played while the video is inside it, else the nearest moment.
  const current = list.find((m) => m.id === view.playing);
  let id = "";
  if (current && inWindow(current)) id = current.id;
  else {
    const inside = list.filter(inWindow);
    if (inside.length) id = inside.reduce((a, b) => (Math.abs(a.video_t - now) <= Math.abs(b.video_t - now) ? a : b)).id;
  }

}

  const now = app.querySelector(".now");

// Where everyone was `ms` after the track starts, sliding between the two nearest samples.
function spotsAt(track, ms) {
  const samples = track.samples;
  let lo = 0, hi = samples.length - 1;
  if (hi < 0 || ms < samples[0][0] - 1000 || ms > samples[hi][0] + 1000) return null;
  while (lo < hi) {

    if (samples[mid][0] <= ms) lo = mid; else hi = mid - 1;

  const [t0, ball0, spots0] = samples[lo];

      zone === 3 ? svg("path", { class: "arrow", d: "M-5 -19 L0 -26 L5 -19 Z" }) : null,
      zone === 1 ? svg("path", { class: "arrow", d: "M-5 11 L0 18 L5 11 Z" }) : null,
      svg("text", { class: "dot-label", y: zone === 3 ? -29 : zone === 2 ? -21 : -12, "text-anchor": "middle" }, p.name)));
  }
  if (spots && spots.ball) marks.push(svg("circle", { class: "ball", cx: x(spots.ball[1]), cy: y(spots.ball[0]), r: 5 }));
  dots.replaceChildren(...marks);
}

// Possession, and a graph of which team was on top when. Marks carry the team colours; text stays in ink.
const FLOW_W = 640, FLOW_H = 176, FLOW_TOP = 12, FLOW_AXIS = 22, FLOW_SIDE = 6;
const FLOW_PLOT = FLOW_H - FLOW_TOP - FLOW_AXIS, FLOW_ZERO = FLOW_TOP + FLOW_PLOT / 2;

function flowBox() {
  const flow = view.data.flow;
  if (!flow) return null;
  const teams = view.data.teams;
  const share = flow.camera_possession || flow.possession.share;
  const loose = Math.max(0, 100 - share[0] - share[1]);
  const { start_s: start, step_ms: step, values } = flow.momentum;
  const end = start + (step / 1000) * Math.max(1, values.length - 1);
  const x = (t) => FLOW_SIDE + ((t - start) / (end - start)) * (FLOW_W - 2 * FLOW_SIDE);
  const y = (v) => FLOW_ZERO - v * (FLOW_PLOT / 2 - 4);
  const at = (i) => start + (i * step) / 1000;
  const lead = (v) => (Math.abs(v) < 0.05 ? "Even" : `${teams[v > 0 ? 0 : 1]} on top, ${Math.round(Math.abs(v) * 100)} of 100`);
  view.flowX = x; view.flowRange = [start, end];

  const possession = [
    el("h2", null, "Possession"),
    el("div", { class: "poss-labels" },
      el("span", null, el("i", { class: "swatch t0" }), `${teams[0]} `, el("b", null, `${Math.round(share[0])}%`)),
      loose >= 1 ? el("span", { class: "muted small" }, `loose ${Math.round(loose)}%`) : null,
      el("span", null, el("b", null, `${Math.round(share[1])}%`), ` ${teams[1]}`, el("i", { class: "swatch t1 after" }))),
    el("div", { class: "poss-bar", role: "img", "aria-label": `Possession: ${teams[0]} ${Math.round(share[0])}%, ${teams[1]} ${Math.round(share[1])}%` },
      el("i", { class: "t0", style: `flex-grow:${share[0]}` }), loose >= 1 ? el("i", { class: "loose", style: `flex-grow:${loose}` }) : null, el("i", { class: "t1", style: `flex-grow:${share[1]}` })),
    el("p", { class: "muted small" }, `${flow.camera_possession ? "Share of the match, from the camera script." : "Share of the time in play, estimated from positions."} Time on the ball (estimated): ${teams[0]} ${clock(flow.possession.seconds[0])}, ${teams[1]} ${clock(flow.possession.seconds[1])}.`),
  ];
  if (values.length < 2) return el("section", { class: "box flow-box" }, ...possession);

  const points = values.map((v, i) => `${x(at(i)).toFixed(1)} ${y(v).toFixed(1)}`);
  const line = `M${points.join("L")}`;
  const area = `${line}L${x(end).toFixed(1)} ${FLOW_ZERO}L${x(start).toFixed(1)} ${FLOW_ZERO}Z`;
  const every = [30, 60, 120, 300, 600, 1200].find((s) => (end - start) / s <= 7) || 1800;
  const ticks = [];
  for (let t = start; t <= end; t += every) ticks.push(t);
  const valueAt = (t) => values[Math.max(0, Math.min(values.length - 1, Math.round(((t - start) * 1000) / step)))] || 0;
  const goals = view.data.moments.filter((m) => m.type === "goal" && m.team != null && m.video_t >= start && m.video_t <= end);
  const tip = el("div", { class: "tip", hidden: true });
  const cross = svg("line", { class: "crosshair", y1: FLOW_TOP, y2: FLOW_TOP + FLOW_PLOT, visibility: "hidden" });
  const chart = el("div", { class: "chart", title: "Click to jump the video here" },
    svg("svg", { viewBox: `0 0 ${FLOW_W} ${FLOW_H}`, role: "img", "aria-label": "Momentum through the match: above the middle line the home team was on top, below it the away team" },
      svg("defs", null,
        svg("clipPath", { id: "flow-up" }, svg("rect", { x: 0, y: 0, width: FLOW_W, height: FLOW_ZERO })),
        svg("clipPath", { id: "flow-down" }, svg("rect", { x: 0, y: FLOW_ZERO, width: FLOW_W, height: FLOW_H - FLOW_ZERO }))),
      ...ticks.map((t) => svg("g", null, svg("line", { class: "grid", x1: x(t), y1: FLOW_TOP, x2: x(t), y2: FLOW_TOP + FLOW_PLOT }), svg("text", { class: "tick", x: x(t), y: FLOW_H - 6, "text-anchor": t === start ? "start" : "middle" }, clock(t)))),
      svg("line", { class: "grid zero", x1: FLOW_SIDE, y1: FLOW_ZERO, x2: FLOW_W - FLOW_SIDE, y2: FLOW_ZERO }),
      svg("g", { "clip-path": "url(#flow-up)", class: "series t0" }, svg("path", { class: "area", d: area }), svg("path", { class: "line", d: line })),
      svg("g", { "clip-path": "url(#flow-down)", class: "series t1" }, svg("path", { class: "area", d: area }), svg("path", { class: "line", d: line })),
      ...goals.map((g) => svg("circle", { class: `goal-dot t${g.team}`, cx: x(g.video_t), cy: y(valueAt(g.video_t)), r: 6.5 }, svg("title", null, `${g.title} at ${clock(g.video_t)}`))),
      svg("line", { class: "playhead", y1: FLOW_TOP, y2: FLOW_TOP + FLOW_PLOT, visibility: "hidden" }),
      cross),
    tip);
  const timeUnder = (e) => {
    const rect = chart.getBoundingClientRect();
    return Math.max(start, Math.min(end, start + ((((e.clientX - rect.left) / rect.width) * FLOW_W - FLOW_SIDE) / (FLOW_W - 2 * FLOW_SIDE)) * (end - start)));
  };
  chart.addEventListener("mousemove", (e) => {
    const t = timeUnder(e);
    cross.setAttribute("x1", x(t)); cross.setAttribute("x2", x(t)); cross.setAttribute("visibility", "visible");
    tip.hidden = false;
    tip.style.left = `${(x(t) / FLOW_W) * 100}%`;
    tip.replaceChildren(el("b", null, clock(t)), ` ${lead(valueAt(t))}`);
  });
  chart.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); tip.hidden = true; });
  chart.addEventListener("click", (e) => { if (view.player) { view.player.seekTo(Math.max(0, timeUnder(e)), true); view.player.playVideo(); } });

  const perMinute = Math.max(1, Math.round(60000 / step));
  const rows = [];
  for (let i = 0; i < values.length; i += perMinute) {
    const chunk = values.slice(i, i + perMinute);
    rows.push(el("tr", null, el("td", null, clock(at(i))), el("td", null, lead(chunk.reduce((a, b) => a + b, 0) / chunk.length))));
  }
  return el("section", { class: "box flow-box" }, ...possession,
    el("div", { class: "box-head" }, el("h2", null, "Momentum"),
      el("p", { class: "legend" }, el("span", null, el("i", { class: "swatch t0" }), `${teams[0]} above the line`), el("span", null, el("i", { class: "swatch t1" }), `${teams[1]} below`))),
    chart,
    el("p", { class: "muted small" }, "An estimate, not a stat from the game: each team scores for time on the ball, passes, shots, saves, ball wins, 50/50s and goals, and it fades over about 20 seconds. 100 is the strongest spell of the match. Dots are goals."),
    el("details", { class: "chart-table" }, el("summary", null, "Show as a table"),
      el("table", null, el("thead", null, el("tr", null, el("th", null, "From"), el("th", null, "On top"))), el("tbody", null, ...rows))));
}

// What follows the video: the dots on the map and the line on the momentum graph.
function paintExtras(now) {
  paintMap(now);
  const head = app.querySelector(".playhead");
  if (head && view.flowRange) {
    const inside = now >= view.flowRange[0] && now <= view.flowRange[1];
    head.setAttribute("visibility", inside ? "visible" : "hidden");
    if (inside) { head.setAttribute("x1", view.flowX(now)); head.setAttribute("x2", view.flowX(now)); }
  }
}

function paintTransport(list) {
  const bar = app.querySelector(".transport");
  if (!bar) return;
  bar.replaceChildren(
    el("button", { onclick: () => step(-1), disabled: !list.length }, "Previous"),
    el("button", { onclick: () => step(1), disabled: !list.length }, "Next"),
    el("label", null, el("input", { type: "checkbox", checked: view.backToBack, onchange: (e) => { view.backToBack = e.target.checked; if (view.backToBack && !view.playing) step(1); } }), "Play back to back"),
    el("span", { class: "muted small" }, `${list.length} moment${list.length === 1 ? "" : "s"}`));
}

function setHash() {
  const hash = view.who ? `${view.data.slug}/${encodeURIComponent(view.who)}` : view.data.slug;
  history.replaceState(null, "", `#${hash}`);
}

async function showMatch(slug, who) {
  if (!/^[a-z0-9]+$/.test(slug)) return showList();
  let data;
  try {
    data = await load(`m/${slug}.json`);
  } catch (e) {
    app.replaceChildren(el("p", { class: "muted" }, "That match isn't here. It may have been removed."));
    return;
  }
  const known = (name) => name === "team:0" || name === "team:1" || data.players.some((p) => p.name === name);
  const picked = who && known(who) ? who : known(remember("film-who")) ? remember("film-who") : "";
  // On a phone the overview starts folded away so the moments are in reach.
  view = { data, who: picked, kinds: new Set(Object.keys(KINDS).filter((k) => k !== "pass")), everyGoal: true, backToBack: false, only: null, overviewOpen: window.innerWidth > 820, player: null, playing: "", shown: "", track: null, trackFailed: false, mirror: remember("film-mirror") === "1" };
  crumb.textContent = data.title;
  teamColors(data.colors);
  render();
  // Positions are a big file: fetched once the page is up, for the map.
  if (data.has_track) {
    load(`m/${slug}.track.json`).then((track) => { if (view && view.data === data) view.track = track; }).catch(() => { if (view && view.data === data) { view.trackFailed = true; paintMap(0); } });
  }
  clearInterval(ticker);
  ticker = setInterval(tick, 200);
}

async function route() {
  clearInterval(ticker);
  view = null;
  crumb.textContent = "";
  if (!(await unlocked())) return; // the password form is showing; it calls route() again
  const [slug, who] = location.hash.replace(/^#/, "").split("/");
  if (!slug) return showList();
  let name = "";
  try { name = decodeURIComponent(who || ""); } catch (e) { /* a mangled link: just open the match */ }
  showMatch(slug, name);
}

document.addEventListener("keydown", (e) => {
  if (!view || e.target.matches("input, select, textarea")) return;
  if (e.key === "n" || e.key === "N") step(1);
  if (e.key === "p" || e.key === "P") step(-1);
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
